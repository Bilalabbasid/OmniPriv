  <text x="220" y="204" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#818cf8">PIM — Privileged Identity Mgmt</text>
  <line x1="70" y1="216" x2="370" y2="216" stroke="#1e3a5f" stroke-width="1"/>

  <rect x="60" y="228" width="155" height="28" rx="6" fill="#0d1f35" stroke="#818cf8" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="72" y="247" font-family="Arial,sans-serif" font-size="9.5" fill="#e2e8f0">Just-in-Time access</text>

  <rect x="225" y="228" width="155" height="28" rx="6" fill="#0d1f35" stroke="#818cf8" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="237" y="247" font-family="Arial,sans-serif" font-size="9.5" fill="#e2e8f0">Role activation</text>

  <rect x="60" y="264" width="155" height="28" rx="6" fill="#0d1f35" stroke="#818cf8" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="72" y="283" font-family="Arial,sans-serif" font-size="9.5" fill="#e2e8f0">Approval workflows</text>

  <rect x="225" y="264" width="155" height="28" rx="6" fill="#0d1f35" stroke="#818cf8" stroke-width="0.6" stroke-opacity="0.25"/>
