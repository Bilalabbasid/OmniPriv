  <rect x="440" y="264" width="155" height="28" rx="6" fill="#0d1f35" stroke="#00B8FF" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="452" y="283" font-family="Arial,sans-serif" font-size="9.5" fill="#e2e8f0">Auto credential rotation</text>

  <rect x="605" y="264" width="155" height="28" rx="6" fill="#0d1f35" stroke="#00B8FF" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="617" y="283" font-family="Arial,sans-serif" font-size="9.5" fill="#e2e8f0">Real-time monitoring</text>

  <text x="600" y="312" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Secures how privileged access is used</text>

  <!-- Footer -->
  <text x="410" y="354" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#475569">PIM vs PAM · omnipriv.com</text>
