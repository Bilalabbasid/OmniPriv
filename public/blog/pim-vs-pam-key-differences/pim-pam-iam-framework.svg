  <line x1="450" y1="216" x2="750" y2="216" stroke="#1e3a5f" stroke-width="1"/>

  <rect x="440" y="228" width="155" height="28" rx="6" fill="#0d1f35" stroke="#00B8FF" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="452" y="247" font-family="Arial,sans-serif" font-size="9.5" fill="#e2e8f0">Credential vaulting</text>

  <rect x="605" y="228" width="155" height="28" rx="6" fill="#0d1f35" stroke="#00B8FF" stroke-width="0.6" stroke-opacity="0.25"/>
