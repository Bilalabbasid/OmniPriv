<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370">
  <defs>
    <linearGradient id="bg-fw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
  </defs>
  <rect width="820" height="370" fill="url(#bg-fw)" rx="14"/>

  <text x="410" y="36" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">PIM + PAM + IAM — Complete Identity Security Framework</text>
  <text x="410" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#64748b">PIM vs PAM · PAM vs IAM · Zero Trust enterprise security</text>

  <!-- IAM (top, widest) -->
  <rect x="40" y="80" width="740" height="65" rx="14" fill="#0d1f35" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="40" y="80" width="8" height="65" rx="4" fill="#f59e0b"/>
  <text x="130" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#f59e0b">👥</text>
  <text x="225" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">IAM — Identity &amp; Access Mgmt</text>
  <text x="225" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#94a3b8">Standard user authentication · SSO · MFA · Lifecycle management</text>
  <text x="570" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">Foundation for all identity-based access</text>

  <!-- Arrow IAM → PIM+PAM -->
  <line x1="410" y1="145" x2="410" y2="162" stroke="#475569" stroke-width="1.5"/>
  <polygon points="405,157 410,168 415,157" fill="#475569"/>

