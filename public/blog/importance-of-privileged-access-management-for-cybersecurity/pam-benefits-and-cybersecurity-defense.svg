<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#030711"/>
    </linearGradient>
    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e223d"/>
      <stop offset="100%" style="stop-color:#061324"/>
    </linearGradient>
    <linearGradient id="badge-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B8FF"/>
      <stop offset="100%" style="stop-color:#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="820" height="420" fill="url(#bg-grad-2)" rx="14"/>
  <rect x="1" y="1" width="818" height="418" fill="none" stroke="#1e3a5f" stroke-width="1" rx="13"/>

  <!-- Title & Subtitle -->
  <text x="410" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.3">Key Privileged Access Management Benefits</text>
  <text x="410" y="58" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8">How PAM Solutions Strengthen Enterprise Cybersecurity &amp; Mitigate Risk</text>

  <!-- 6 Benefits Grid (3 columns x 2 rows) -->
  
  <!-- Row 1, Col 1: Credential Protection -->
  <g transform="translate(35, 78)">
    <rect width="236" height="150" rx="10" fill="url(#card-grad-2)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="14" y="16" width="38" height="38" rx="8" fill="#00B8FF" fill-opacity="0.15" stroke="#00B8FF" stroke-width="0.8"/>
    <text x="33" y="41" text-anchor="middle" font-size="18">🔐</text>
    <text x="62" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Credential Protection</text>
    <text x="62" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Eliminate Shared Secrets</text>
    
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="10.5" fill="#cbd5e1" width="208">
      <tspan x="14" dy="0">• Centralized password vaulting</tspan>
      <tspan x="14" dy="18">• Automatic password &amp; key rotation</tspan>
      <tspan x="14" dy="18">• Eradicate hardcoded scripts</tspan>
      <tspan x="14" dy="18">• Hide root &amp; admin passwords</tspan>
    </text>
  </g>

  <!-- Row 1, Col 2: Least Privilege & JIT -->
  <g transform="translate(292, 78)">
    <rect width="236" height="150" rx="10" fill="url(#card-grad-2)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="14" y="16" width="38" height="38" rx="8" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="0.8"/>
    <text x="33" y="41" text-anchor="middle" font-size="18">⏱️</text>
    <text x="62" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Least Privilege &amp; JIT</text>
    <text x="62" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#818cf8">Zero Standing Privileges</text>
    
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="14" dy="0">• Ephemeral time-bound access</tspan>
      <tspan x="14" dy="18">• Multi-step approval workflows</tspan>
      <tspan x="14" dy="18">• Granular command-level controls</tspan>
      <tspan x="14" dy="18">• Auto-revoke rights after completion</tspan>
    </text>
  </g>

  <!-- Row 1, Col 3: Session Monitoring -->
  <g transform="translate(549, 78)">
    <rect width="236" height="150" rx="10" fill="url(#card-grad-2)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="14" y="16" width="38" height="38" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
    <text x="33" y="41" text-anchor="middle" font-size="18">📹</text>
    <text x="62" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Session Auditing</text>
    <text x="62" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#34d399">Real-Time Visibility</text>
    
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="14" dy="0">• Live session proxying &amp; view</tspan>
      <tspan x="14" dy="18">• Full video &amp; keystroke logs</tspan>
      <tspan x="14" dy="18">• Instant session termination</tspan>
      <tspan x="14" dy="18">• Fast forensic incident response</tspan>
    </text>
  </g>

  <!-- Row 2, Col 1: Strong MFA & Auth -->
  <g transform="translate(35, 244)">
    <rect width="236" height="150" rx="10" fill="url(#card-grad-2)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="14" y="16" width="38" height="38" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="0.8"/>
    <text x="33" y="41" text-anchor="middle" font-size="18">🔑</text>
    <text x="62" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Strong Authentication</text>
    <text x="62" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#fbbf24">Multi-Factor Controls</text>
    
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="14" dy="0">• Hardware token &amp; app MFA</tspan>
      <tspan x="14" dy="18">• SSO &amp; IdP directory integration</tspan>
      <tspan x="14" dy="18">• Context-aware access gates</tspan>
      <tspan x="14" dy="18">• Anti-phishing identity barriers</tspan>
    </text>
  </g>

  <!-- Row 2, Col 2: Compliance & Governance -->
  <g transform="translate(292, 244)">
    <rect width="236" height="150" rx="10" fill="url(#card-grad-2)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="14" y="16" width="38" height="38" rx="8" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-width="0.8"/>
    <text x="33" y="41" text-anchor="middle" font-size="18">📋</text>
    <text x="62" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Compliance Readiness</text>
    <text x="62" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#f472b6">Auditing &amp; Reporting</text>
    
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="14" dy="0">• ISO 27001, SOC 2, PCI-DSS</tspan>
      <tspan x="14" dy="18">• NIST Zero Trust SP 800-207</tspan>
      <tspan x="14" dy="18">• Tamper-proof audit evidence</tspan>
      <tspan x="14" dy="18">• Automated compliance reports</tspan>
    </text>
  </g>

  <!-- Row 2, Col 3: Attack Surface Reduction -->
  <g transform="translate(549, 244)">
    <rect width="236" height="150" rx="10" fill="url(#card-grad-2)" stroke="#1e3a5f" stroke-width="1"/>
    <rect x="14" y="16" width="38" height="38" rx="8" fill="#00B8FF" fill-opacity="0.15" stroke="#00B8FF" stroke-width="0.8"/>
    <text x="33" y="41" text-anchor="middle" font-size="18">🛡️</text>
    <text x="62" y="32" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Attack Surface Reduction</text>
    <text x="62" y="47" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#38bdf8">Block Lateral Movement</text>
    
    <text x="14" y="78" font-family="Arial,sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan x="14" dy="0">• Prevent credential escalation</tspan>
      <tspan x="14" dy="18">• Neutralize insider threat risk</tspan>
      <tspan x="14" dy="18">• Air-gap critical infrastructure</tspan>
      <tspan x="14" dy="18">• Minimize breach blast radius</tspan>
    </text>
  </g>

  <!-- Footer -->
  <text x="410" y="407" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#64748b">OmniPriv PAM Delivers Continuous Verification, Granular Accountability, and Complete Identity Governance</text>
</svg>
