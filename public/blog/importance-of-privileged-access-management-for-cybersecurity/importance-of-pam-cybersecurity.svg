      <circle cx="26" cy="26" r="14" fill="#6366f1" opacity="0.3"/>
      <text x="26" y="31" text-anchor="middle" font-size="14">🗄️</text>
      <text x="50" y="22" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Critical Databases</text>
