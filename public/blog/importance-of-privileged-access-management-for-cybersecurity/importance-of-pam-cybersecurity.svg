  <path d="M 230 230 L 310 230" fill="none" stroke="#00B8FF" stroke-width="2" opacity="0.9"/>
  <path d="M 230 315 L 290 315 L 290 230 L 310 230" fill="none" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

